# Seconds for the bars to halve when paused / unloaded / finished ("party stopped").
pause_decay_secs: 0.4

alpha0: 0.75
alpha1: 0.35

smoothing0:
  window_size: 7
  degree: 3
  order: 0

smoothing1:
  window_size: 9
  degree: 3
  order: 0

binning:
  # C1 through the useful high-percussion/air band. Gamma controls bar placement;
  # compensation below handles the expected musical high-frequency rolloff.
  bins: 72
  fmin: 32.703
  fmax: 12000.0
  gamma: 5
  discrete_levels: 52
  compensation:
    # 0.0 is average RMS density, 1.0 is total band energy.
    bandwidth_weight: 0.5
    # Music-like spectra commonly lose about 3 dB per octave.
    spectral_tilt_db_per_octave: 3.0
    tilt_reference_hz: 1000.0
    max_adjustment_db: 18.0

min_db: -53.0
max_db: -5.0
