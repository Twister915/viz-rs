[package]
name = "vis-rs"
version = "0.1.0"
authors = ["Joey Sacchini <joey@sacchini.net>"]
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.103"
fftw = "0.8.0"
# Build SDL2 from the vendored source at compile time and statically link it
# into the binary, so no external SDL2.dll / SDL2.lib is ever needed.
# Requires a C compiler + cmake at build time (both ship with Visual Studio).
sdl2 = { version = "0.38.0", features = ["bundled", "static-link"] }
rayon = "1.12.0"
num-rational = "0.4.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"

#[profile.dev]
#opt-level = 1

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
overflow-checks = false
incremental = false
panic = "abort"
